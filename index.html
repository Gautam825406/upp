<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6ec" />

    <!--
      Apply the saved theme before first paint.

      This has to run inline and synchronously, before the stylesheet paints, otherwise a returning
      visitor who chose dark mode would see a flash of the light theme. Light is the default —
      most parents read this on a phone in daylight — and the markup below ships `class="light"`
      so the no-JS path still renders correctly.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('upp-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          var el = document.documentElement;
          el.classList.toggle('light', theme === 'light');
          el.classList.toggle('dark', theme === 'dark');
          el.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#faf6ec' : '#0f1a14');
        } catch (e) {
          /* storage blocked — fall through to the light default on the <html> tag */
        }
      })();
    </script>

    <!--
      Primary SEO tags. The values below are the HOMEPAGE defaults so that the static HTML is
      already correct for crawlers even before JavaScript runs. Every route rewrites these
      through <Seo /> (client-side, on navigation) and scripts/prerender.mjs (build-time).
      No keywords meta tag: search engines ignore it, and stuffing it reads as spam.
    -->
    <title>U++ Academy | Coaching in Maharajgunj, Madhygopali &amp; Chouparan</title>
    <meta
      name="description"
      content="U++ Academy offers Class 6–12 coaching for JAC, CBSE and ICSE students in Madhygopali, Maharajgunj, serving nearby Chouparan. Call 8862958656."
    />
    <meta name="author" content="U++ Academy" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://uppacademy.in/" />
